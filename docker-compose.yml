name: kg-platform

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: kg-namenode
    hostname: namenode
    environment:
      CLUSTER_NAME: kg-cluster
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "1"
    ports:
      - "9870:9870"   # HDFS web UI + WebHDFS
      - "9000:9000"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: kg-datanode
    hostname: datanode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "1"
      SERVICE_PRECONDITION: "namenode:9870"
    ports:
      - "9864:9864"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  neo4j:
    image: neo4j:5.26-community
    container_name: kg-neo4j
    environment:
      NEO4J_AUTH: neo4j/kgpassword123
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_server_memory_heap_max__size: 2G
    ports:
      - "7475:7474"   # Neo4j Browser -> http://localhost:7475
      - "7688:7687"   # Bolt (host port 7688)
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

  # Python + PySpark service: crawler, LLM extraction, Spark jobs, GraphRAG, Streamlit UI
  app:
    build: .
    container_name: kg-app
    env_file: .env
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8501:8501"   # Streamlit
      - "4040:4040"   # Spark UI (while a job runs)
    depends_on:
      - namenode
      - datanode
      - neo4j
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

  # REST API (FastAPI) exposing GraphRAG + Cypher analytics, protected by API keys
  api:
    build: .
    container_name: kg-api
    env_file: .env
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  hdfs_namenode:
  hdfs_datanode:
  neo4j_data:
  neo4j_plugins:
